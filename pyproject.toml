[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-deduplicator"
version = "1.0.0"
description = "Detect and merge duplicate contact records in CSV files using fuzzy name matching and validated email/phone comparison."
readme = "README.md"
license = "MIT"
authors = [{ name = "Matt" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=3.0.5,<4.0.0",
    "click>=8.4.2,<9.0.0",
    "fuzzywuzzy>=0.18.0,<0.19.0",
    "python-Levenshtein>=0.27.3,<0.28.0",
    "email-phone-validator @ git+https://github.com/Matthew-Cassin/email-phone-validator.git@v0.1.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]
keywords = ["contact", "deduplication", "csv", "fuzzy-matching", "data-cleaning", "crm"]

[project.urls]
Homepage = "https://github.com/Matthew-Cassin/contact-deduplicator"
Repository = "https://github.com/Matthew-Cassin/contact-deduplicator"
Issues = "https://github.com/Matthew-Cassin/contact-deduplicator/issues"

[project.scripts]
contact-deduplicator = "contact_deduplicator.cli:deduplicate"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contact_deduplicator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["contact_deduplicator"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

# python_version intentionally unset: mypy then targets whatever interpreter
# runs it, which matches each CI matrix leg. A hardcoded low pin here breaks
# on newer numpy/pandas stubs that use 3.12+-only stub syntax.
[tool.mypy]
strict = true

# fuzzywuzzy ships no type stubs and hasn't been updated upstream since 2021.
# email-phone-validator is pinned to the v0.1.0 tag here, predating its
# py.typed marker (added in that project's 1.0.0) -- bump this override away
# once the pinned tag below is updated to >=v1.0.0.
[[tool.mypy.overrides]]
module = ["fuzzywuzzy.*", "email_phone_validator.*"]
ignore_missing_imports = true
